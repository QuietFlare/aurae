# Runs the full Aurae stack from built images, the way a practice without k3s would.
# Development uses api/compose.yaml instead, where the app runs from your IDE.
#
# This file holds what every installation shares. The identity provider comes from a second file:
#   compose.keycloak.yaml  the bundled Keycloak
#   compose.cognito.yaml   the AWS Cognito test pool
# .env picks one through COMPOSE_FILE, so "docker compose up -d" is enough. See README.md here.
name: aurae

services:
  # The only container other machines can reach. It serves https on AURAE_HOST.
  caddy:
    image: 'caddy:2'
    environment:
      - 'AURAE_HOST=${AURAE_HOST:?set AURAE_HOST in .env}'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
      - './tls/server:/tls:ro'
      - 'caddy-data:/data'
    networks:
      default:
        # Aurae reaches the identity provider under the same https address the browser uses,
        # or the token check fails. Inside the Compose network that name leads here.
        aliases:
          - '${AURAE_HOST:?set AURAE_HOST in .env}'
    restart: unless-stopped

  aurae:
    image: 'ghcr.io/quietflare/aurae:0.0.1-SNAPSHOT'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aurae'
      - 'SPRING_DATASOURCE_USERNAME=aurae'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      # Caddy tells Aurae the address the browser used, so redirects point to https.
      - 'SERVER_FORWARD_HEADERS_STRATEGY=native'
      # The image adds the certificates under this folder to the ones Java trusts at start.
      - 'SERVICE_BINDING_ROOT=/bindings'
    volumes:
      - './tls/ca:/bindings/ca-certificates:ro'
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=aurae'
      - 'POSTGRES_USER=aurae'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurae -d aurae']
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
